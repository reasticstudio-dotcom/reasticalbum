<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Foto Album</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <header class="bg-white shadow-sm sticky top-0 z-30 border-b border-slate-100">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Pilih Foto: <span id="nama-album" class="text-indigo-600">Album</span></h1>
                <p class="text-xs text-slate-500">Centang foto pilihan Anda sesuai batas kuota.</p>
            </div>
            <div class="bg-indigo-50 border border-indigo-100 px-4 py-2 rounded-xl text-sm flex items-center gap-2">
                <span class="font-medium text-indigo-700">Terpilih:</span>
                <span id="counter" class="font-bold text-indigo-800 text-base">0</span> / <span id="max-limit" class="font-bold text-indigo-800 text-base">5</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 mt-6">
        <!-- Loading State -->
        <div id="loading" class="text-center py-12 text-slate-500">
            <p class="text-base font-semibold">Sedang memuat foto dari Google Drive...</p>
            <p class="text-xs text-slate-400 mt-1">Mohon tunggu sebentar.</p>
        </div>

        <!-- Peringatan Kuota -->
        <div id="alert-box" class="hidden mb-6 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-xl text-sm">
            ⚠️ <span id="alert-text">Batas maksimal pemilihan foto sudah tercapai!</span>
        </div>

        <!-- Galeri Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4" id="gallery-grid"></div>

        <!-- Catatan & WhatsApp -->
        <div id="action-section" class="hidden mt-8 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <h2 class="text-base font-bold text-slate-900 mb-2">Catatan / Request Edit Khusus</h2>
            <textarea id="catatan" rows="3" class="w-full border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Tulis catatan jika ada..."></textarea>
            
            <button onclick="kirimKeWhatsApp()" class="mt-4 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl transition cursor-pointer shadow-sm">
                Kirim Pilihan ke WhatsApp Admin
            </button>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const albumParam = urlParams.get('album');
        const maxParam = urlParams.get('max');
        const folderParam = urlParams.get('folder');
        const scriptParam = urlParams.get('script');

        const maxLimit = maxParam ? parseInt(maxParam) : 5;
        document.getElementById('nama-album').textContent = albumParam ? albumParam.replace(/-/g, ' ').toUpperCase() : "ALBUM";
        document.getElementById('max-limit').textContent = maxLimit;

        if (folderParam && scriptParam) {
            fetch(`${scriptParam}?folderUrl=${encodeURIComponent(folderParam)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    if (data.status === 'success' && data.photos.length > 0) {
                        renderGallery(data.photos);
                        document.getElementById('action-section').classList.remove('hidden');
                    } else {
                        document.getElementById('gallery-grid').innerHTML = `<p class="col-span-full text-center text-red-500 py-8">Tidak ada foto ditemukan di folder tersebut atau folder belum disetting Publik.</p>`;
                    }
                })
                .catch(err => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('gallery-grid').innerHTML = `<p class="col-span-full text-center text-red-500 py-8">Gagal memuat foto. Periksa kembali URL script Anda.</p>`;
                });
        } else {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('gallery-grid').innerHTML = `<p class="col-span-full text-center text-slate-400 py-8">Parameter folder belum lengkap.</p>`;
        }

        function renderGallery(photos) {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            photos.forEach(photo => {
                let card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative group";
                card.innerHTML = `
                    <div class="relative aspect-square bg-slate-100 overflow-hidden">
                        <img src="${photo.url}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <label class="absolute top-3 right-3 cursor-pointer z-10 bg-white/90 p-1.5 rounded-full shadow">
                            <input type="checkbox" name="foto" value="${photo.name}" class="foto-checkbox w-5 h-5 accent-indigo-600 rounded cursor-pointer">
                        </label>
                    </div>
                    <div class="p-3 text-center text-xs font-medium text-slate-600 truncate">
                        ${photo.name}
                    </div>
                `;
                grid.appendChild(card);
            });

            // Logika Checkbox & Limit
            const checkboxes = document.querySelectorAll('.foto-checkbox');
            const counter = document.getElementById('counter');
            const alertBox = document.getElementById('alert-box');

            checkboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    const checkedCount = document.querySelectorAll('.foto-checkbox:checked').length;
                    if (checkedCount > maxLimit) {
                        cb.checked = false;
                        alertBox.classList.remove('hidden');
                    } else {
                        counter.textContent = checkedCount;
                        if(checkedCount < maxLimit) {
                            alertBox.classList.add('hidden');
                        }
                    }
                });
            });
        }

        function kirimKeWhatsApp() {
            const selected = Array.from(document.querySelectorAll('.foto-checkbox:checked')).map(cb => cb.value);
            const catatan = document.getElementById('catatan').value.trim();

            if (selected.length === 0) {
                alert('Pilih minimal 1 foto terlebih dahulu!');
                return;
            }

            const adminPhone = "6281234567890"; // Ganti nomor WhatsApp Anda
            const pesan = `Halo Admin, saya memilih foto untuk album *${document.getElementById('nama-album').textContent}*:\n\n*Jumlah:* ${selected.length} / ${maxLimit}\n*Daftar File:*\n- ${selected.join('\n- ')}\n\n*Catatan:* ${catatan || '-'}`;
            
            window.open(`https://wa.me/${adminPhone}?text=${encodeURIComponent(pesan)}`, '_blank');
        }
    </script>
</body>
</html>
